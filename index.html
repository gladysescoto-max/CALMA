<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALMA — Pregunta para ti</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#f7e9f5,#e8f3ed);color:#33263d;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(680px,88%);background:#fffdfb;border-radius:28px;padding:34px;box-shadow:0 12px 40px #0001;text-align:center}
.logo{font-size:44px;font-weight:800;color:#68458a;letter-spacing:2px}
.subtitle{color:#777;margin-bottom:28px}
.tag{display:inline-block;padding:8px 14px;border-radius:20px;background:#efe3f7;color:#68458a;font-weight:700}
.question{font-size:30px;line-height:1.25;margin:28px 0;color:#473054}
.tip{background:#f7f1fa;border-radius:18px;padding:18px;text-align:left;line-height:1.5}
button{margin-top:24px;border:0;border-radius:18px;padding:15px 22px;background:#68458a;color:white;font-size:16px;font-weight:700;cursor:pointer}
.small{font-size:13px;color:#888;margin-top:18px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">CALMA</div>
  <div class="subtitle">Tu espacio para detenerte, reflexionar y volver a ti.</div>
  <div class="tag">PREGUNTA PARA TI</div>
  <div id="question" class="question"></div>
  <div id="tip" class="tip"></div>
  <button onclick="newQuestion()">Quiero otra pregunta</button>
  <div class="small">Este recurso es de reflexión y autorregulación. No sustituye la atención de un profesional de la salud mental.</div>
</main>
<script>
const questions = [
 ["¿Qué evidencia tienes de ese pensamiento?","Distingue entre lo que sabes, lo que supones y lo que temes."],
 ["¿Qué parte de esta situación sí puedes controlar?","Enfócate en aquello sobre lo que realmente tienes capacidad de actuar."],
 ["¿Qué le dirías a alguien que quieres si estuviera pensando lo mismo?","Intenta ofrecerte la misma comprensión que ofrecerías a otra persona."],
 ["¿Estás describiendo un hecho o haciendo una suposición?","Separar hechos de interpretaciones puede ayudarte a mirar la situación con más claridad."],
 ["¿Qué otra explicación podría existir?","Busca al menos una alternativa a la interpretación que te está generando malestar."],
 ["¿Este pensamiento te ayuda o te perjudica?","Pregúntate si mantenerlo te acerca o te aleja de lo que necesitas."],
 ["¿Qué necesitas en este momento?","Puede ser descanso, compañía, espacio, información, apoyo o simplemente unos minutos."],
 ["¿Qué pequeño paso puedes dar ahora?","No necesitas resolverlo todo hoy. Identifica una acción pequeña y posible."],
 ["¿Qué has superado antes que demuestra que puedes afrontar dificultades?","Recuerda recursos, aprendizajes y experiencias que ya forman parte de ti."],
 ["¿Qué estás dando por hecho sin tener pruebas?","Cuestiona las conclusiones automáticas antes de tratarlas como certezas."]
];

function newQuestion(){
 const q = questions[Math.floor(Math.random()*questions.length)];
 document.getElementById("question").textContent=q[0];
 document.getElementById("tip").textContent=q[1];
}
newQuestion();
</script>
</body>
</html>
